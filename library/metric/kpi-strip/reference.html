<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>KPI Strip · Pilot Outcomes</title><style>
:root{color-scheme:dark;--bg:#101820;--line:#344752;--text:#eaf2f5;--muted:#a0b2b9;--cyan:#78dce5;--sand:#cbb28b;--mono:ui-monospace,monospace;--sans:system-ui,"Noto Sans Arabic",sans-serif}*{box-sizing:border-box}body{margin:0;background:linear-gradient(110deg,#14252e,var(--bg) 65%);color:var(--text);font:15px/1.7 var(--sans)}main{width:min(1000px,calc(100% - 32px));margin:48px auto}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.heading small{color:var(--cyan);font:10px var(--mono);letter-spacing:.1em}.heading h1{font-size:28px;margin:7px 0 0}.heading span{color:var(--muted);font:10px var(--mono)}.strip{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line)}.cell{padding:20px 16px;border-left:1px solid var(--line);position:relative}.cell:last-child{border:0}.cell:before{content:"";position:absolute;top:-1px;right:0;width:28px;height:2px;background:var(--cyan)}.cell:nth-child(2):before{background:var(--sand)}.cell:nth-child(4):before{background:#8297a3}.value{font:700 38px var(--mono);color:var(--text);direction:ltr;text-align:right}.label{color:var(--muted);font-size:12px}.qualifier{display:block;color:var(--cyan);font:9px var(--mono);margin-top:5px}.context{display:flex;justify-content:space-between;gap:20px;padding-top:14px;color:var(--muted);font-size:12px}
@media(max-width:650px){main{margin:20px auto}.heading{align-items:flex-start;flex-direction:column}.heading h1{font-size:24px}.strip{grid-template-columns:repeat(2,1fr)}.cell{padding:15px 10px}.cell:nth-child(2){border-left:0}.cell:nth-child(n+3){border-top:1px solid var(--line)}.value{font-size:30px}.label{font-size:10px}.context{flex-direction:column;gap:6px}}
</style></head><body><main><header class="heading"><div><small>METRIC / KPI STRIP</small><h1>نتيجة التجربة · <bdi dir="ltr">Wave 05</bdi></h1></div><span>ILLUSTRATIVE SAMPLE</span></header><section class="strip" aria-label="Pilot KPI measures"><div class="cell"><div class="value">12</div><div class="label">تقارير في العينة</div><small class="qualifier">TOTAL</small></div><div class="cell"><div class="value">9</div><div class="label">اجتازت أول مراجعة</div><small class="qualifier">FIRST PASS</small></div><div class="cell"><div class="value">2</div><div class="label">احتاجت إصلاحًا بصريًا</div><small class="qualifier">ONE ROUND EACH</small></div><div class="cell"><div class="value">1</div><div class="label">توقفت لغياب المصدر</div><small class="qualifier">SOURCE HOLD</small></div></section><div class="context"><span>Counts describe this scenario only.</span><span>Next decision: gate provenance before six more reports.</span></div></main></body></html>
