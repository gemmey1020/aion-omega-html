<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Quote-Led · Sourced Thesis</title><style>
:root{color-scheme:dark;--bg:#111815;--ink:#eff1ec;--muted:#aab8b0;--line:#3b4a43;--accent:#8fd3c7;--warm:#d5bd8d;--panel:#19221e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 system-ui,"Noto Sans Arabic",sans-serif}
bdi[dir=ltr],code,small,.mono{font-variant-numeric:tabular-nums}
small,.muted{color:var(--muted)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><style>:root{--bg:#111815;--ink:#eff1ec;--muted:#aab8b0;--line:#3b4a43;--accent:#8fd3c7;--warm:#d5bd8d;--panel:#19221e}.quote-sheet{width:min(960px,calc(100% - 44px));margin:36px auto 64px}.quote-head{display:flex;justify-content:space-between;color:var(--muted);font:10px ui-monospace,monospace;border-bottom:1px solid var(--line);padding-bottom:13px}.quote-sheet blockquote{margin:0;padding:88px 7% 34px;position:relative}.quote-sheet blockquote:before{content:"“";position:absolute;right:0;top:38px;color:var(--warm);font:100px/1 Georgia,serif}.quote-sheet blockquote p{max-width:820px;margin:0;font:clamp(32px,5.6vw,58px)/1.48 Georgia,"Noto Naskh Arabic",serif}.quote-source{display:grid;grid-template-columns:58px 1fr minmax(170px,.6fr);gap:18px;align-items:center;border-top:1px solid var(--line);padding:22px 7%}.quote-source .index{color:var(--accent);font:12px ui-monospace,monospace}.quote-source strong{display:block}.quote-source small{font:10px ui-monospace,monospace;letter-spacing:.04em}.quote-context{border-right:1px solid var(--warm);padding-right:16px;color:var(--muted);font-size:13px}@media(max-width:640px){.quote-sheet{margin:20px auto 40px}.quote-head{font-size:8px}.quote-sheet blockquote{padding:64px 4% 26px}.quote-sheet blockquote:before{top:20px;font-size:78px}.quote-source{grid-template-columns:34px 1fr;gap:8px 12px;padding:18px 4%}.quote-context{grid-column:2}.quote-sheet blockquote p{font-size:35px}}</style></head><body><main class="quote-sheet"><div class="quote-head"><span>Ω / FOUNDER THESIS</span><span dir="ltr">QUOTE-LED OPENING · ILLUSTRATIVE</span></div><blockquote><p>«ابدأ من الدليل الذي يغيّر القرار، ثم اشرح ما حوله.»</p></blockquote><div class="quote-source"><span class="index">01</span><div><strong>مبدأ للمراجعة، لا اقتباس من شخص حقيقي</strong><small dir="ltr">EDITORIAL PRINCIPLE · SAMPLE TEXT</small></div><aside class="quote-context">السياق يسبق التوصية. لا تُنسب العبارة إلى مصدر غير متاح.</aside></div></main></body></html>
